<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin – Commandes</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
body{font-family:Arial,sans-serif;background:#f5ecdc;color:#2b2a33;margin:0;padding:16px}
input,select,button{padding:10px;border-radius:8px;border:1px solid #d6c4a0;font-size:15px}
button{background:#e8890c;color:#fff;border:0;font-weight:bold;cursor:pointer}
#login{max-width:320px;margin:60px auto;display:grid;gap:10px}
#app{display:none}.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.w{overflow-x:auto}table{border-collapse:collapse;width:100%;background:#fffaf0;font-size:14px}
th{background:#e8890c;color:#fff}td,th{padding:8px;border-bottom:1px solid #e2d3b5;text-align:start;white-space:nowrap}
.Confirmed{background:#c6efce}.Waiting{background:#ffeb9c}.False\ order{background:#ffc7ce}.On\ check{background:#bdd7ee}.Double\ order{background:#e4c8f0}
</style></head><body>
<form id="login"><h2>Admin</h2>
 <input id="em" name="email" type="email" placeholder="Email" autocomplete="username" required>
 <input id="pw" name="password" type="password" placeholder="Mot de passe" autocomplete="current-password" required>
 <label style="font-size:14px"><input type="checkbox" id="rm" checked style="width:auto"> Rester connecté sur cet appareil</label>
 <button id="go" type="submit">Connexion</button><small id="err" style="color:#c00"></small></form>
<div id="app">
 <div class="bar"><b id="cnt"></b><select id="flt"><option value="">Tous</option><option>Confirmed</option><option>Waiting</option><option>False order</option><option>On check</option><option>Double order</option></select><button id="rf">Actualiser</button><button id="out">Déconnexion</button></div>
 <div class="w"><table><thead><tr><th>Date</th><th>Nom</th><th>Téléphone</th><th>Wilaya</th><th>Adresse</th><th>Qté</th><th>Livraison</th><th>Prix liv.</th><th>Total</th><th>Statut</th></tr></thead><tbody id="rows"></tbody></table></div>
</div>
<script>
const SUPABASE_URL="https://uuqrprzkinlkxovzfjsm.supabase.co", SUPABASE_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InV1cXJwcnpraW5sa3hvdnpmanNtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTUzMDA0MTMsImV4cCI6MjExMDg3NjQxM30.fILi0KaRknHN7EQnV2Ucool6rvgBfd6d5v-pO899Als";   // mêmes valeurs que index.html
const $=s=>document.querySelector(s);
if(!SUPABASE_URL||!SUPABASE_KEY){$("#err").textContent="⚠️ SUPABASE_URL / SUPABASE_KEY manquants dans admin.html";throw new Error("missing keys")}
if(!window.supabase){$("#err").textContent="⚠️ Bibliothèque Supabase non chargée (vérifiez la connexion)";throw new Error("lib")}
const store=()=>localStorage.getItem("rm")==="0"?sessionStorage:localStorage;
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,
 storage:{getItem:k=>store().getItem(k),setItem:(k,v)=>store().setItem(k,v),removeItem:k=>{localStorage.removeItem(k);sessionStorage.removeItem(k)}}}});
if(localStorage.getItem("rm_email"))$("#em").value=localStorage.getItem("rm_email");
const ST=["Confirmed","Waiting","False order","On check","Double order"];
const esc=t=>String(t??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
async function load(){
  let q=sb.from("orders").select("*").order("created_at",{ascending:false}).limit(500);
  if($("#flt").value)q=q.eq("status",$("#flt").value);
  const {data,error}=await q;if(error){alert(error.message);return}
  $("#cnt").textContent=data.length+" commandes";
  $("#rows").innerHTML=data.map(o=>`<tr><td>${new Date(o.created_at).toLocaleString("fr-DZ")}</td><td>${esc(o.name)}</td><td><a href="tel:${esc(o.phone)}">${esc(o.phone)}</a></td><td>${esc(o.wilaya)}</td><td>${esc(o.address)}</td><td>${o.qty}</td><td>${esc(o.delivery)}</td><td>${o.delivery_price}</td><td>${o.total}</td>
  <td><select class="${o.status}" data-id="${o.id}">${ST.map(s=>`<option ${s===o.status?"selected":""}>${s}</option>`).join("")}</select></td></tr>`).join("");
}
$("#rows").onchange=async e=>{const s=e.target;const {error}=await sb.from("orders").update({status:s.value}).eq("id",s.dataset.id);if(error)alert(error.message);else s.className=s.value};
async function show(){const {data}=await sb.auth.getSession();const ok=!!data.session;$("#login").style.display=ok?"none":"grid";$("#app").style.display=ok?"block":"none";if(ok)load()}
$("#login").onsubmit=async e=>{e.preventDefault();localStorage.setItem("rm",$("#rm").checked?"1":"0");if($("#rm").checked)localStorage.setItem("rm_email",$("#em").value);else localStorage.removeItem("rm_email");const {error}=await sb.auth.signInWithPassword({email:$("#em").value,password:$("#pw").value});if(error)$("#err").textContent=error.message;else show()};
$("#out").onclick=async()=>{await sb.auth.signOut();show()};$("#rf").onclick=load;$("#flt").onchange=load;show();
</script></body></html>
